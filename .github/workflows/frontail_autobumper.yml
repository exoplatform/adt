name: Auto Bump Frontail version for Acceptance
on:
  schedule:
    - cron: "5 11 * * 0-4" # Everyday at 11 AM UTC from Sunday to Thursday
  workflow_dispatch:
# The push uses SWF_TOKEN (given to checkout); the token of the workflow itself needs no right
permissions:
  contents: read
env:
  BASE_IMAGE: hbenali/frontail
jobs:
  cb-bumper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SWF_TOKEN }}
      - name: Looking for Frontail updates
        run: |
          latestTag=$(curl -fsSL "https://hub.docker.com/v2/repositories/${{ env.BASE_IMAGE }}/tags/?page_size=1000" | jq -r '.results | .[] | .name' | grep -P '^[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "${latestTag}" ]; then
            echo "Error: Could not get latest tag of ${{ env.BASE_IMAGE }} image! Abort!"
            exit 1
          fi
          sed -Ei "s|configurable_env_var \"DEPLOYMENT_FRONTAIL_IMAGE_VERSION\".*|configurable_env_var \"DEPLOYMENT_FRONTAIL_IMAGE_VERSION\" \"${latestTag}\"|g" _functions.sh
          git add _functions.sh
          if git diff-index --quiet HEAD; then
            echo "Nothing to commit!"
          else
            git config --global user.email "exo-swf@exoplatform.com"
            git config --global user.name "exo-swf"
            git commit -m "Bump frontail version to ${latestTag}"
            git push origin HEAD
          fi
