version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/web"
    schedule:
      # Check for Go module updates every week
      interval: "weekly"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
